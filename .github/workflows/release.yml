name: Build Foundry Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: candlelight-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read system version
        id: version
        shell: bash
        run: |
          VERSION=$(python -c "import json; print(json.load(open('system.json'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Materialize production portrait artwork
        shell: bash
        run: |
          mkdir -p assets/ui
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib

          files = sorted(Path('assets/ui/source').glob('portrait-frame.webp.b64.*'))
          text = ''.join(p.read_text() for p in files)
          text = ''.join(ch for ch in text if ch.isalnum() or ch in '+/=')

          expected_length = 66488
          expected_sha = '9add0d0e47df421e111ca9f8e715d58883155d60502fb513a43685df38e04d11'

          def decode(candidate):
              try:
                  return base64.b64decode(candidate, validate=True)
              except Exception:
                  return None

          data = None
          repaired_at = None
          if len(text) == expected_length:
              candidate = decode(text)
              if candidate and hashlib.sha256(candidate).hexdigest() == expected_sha:
                  data = candidate
          elif len(text) == expected_length + 1:
              # The GitHub text connector inserted one valid base64 character into chunk 01.
              # Repair deterministically by accepting only the candidate whose decoded bytes
              # exactly match the locally verified production artwork SHA-256.
              start, end = 17000, 34001
              for i in range(start, min(end, len(text))):
                  candidate_text = text[:i] + text[i+1:]
                  candidate = decode(candidate_text)
                  if candidate and hashlib.sha256(candidate).hexdigest() == expected_sha:
                      data = candidate
                      repaired_at = i
                      break

          if data is None:
              raise SystemExit(f'Could not reconstruct verified portrait frame from {len(text)} base64 characters')
          if data[:4] != b'RIFF' or data[8:12] != b'WEBP':
              raise SystemExit('Verified portrait frame is not RIFF/WEBP')

          Path('assets/ui/portrait-frame.webp').write_bytes(data)
          if repaired_at is not None:
              print(f'Repaired one connector-inserted base64 character at index {repaired_at}')
          print(f'Portrait frame verified: {len(data)} bytes, sha256={hashlib.sha256(data).hexdigest()}')
          PY

      - name: Validate Foundry system source
        shell: bash
        run: |
          test -f scripts/candlelight.mjs
          test -f styles/candlelight.css
          test -f templates/character-sheet.hbs
          test -f assets/icons/spirits/wolf.webp
          test -f assets/ui/portrait-frame.webp
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('system.json').read_text())
          required = ['id', 'title', 'version', 'manifest', 'download']
          missing = [key for key in required if not data.get(key)]
          if missing:
              raise SystemExit(f"Missing required manifest keys: {', '.join(missing)}")
          PY

      - name: Build Foundry install archive
        shell: bash
        run: |
          rm -f candlelight.zip
          zip -r candlelight.zip . \
            -x '.git/*' \
               '.github/*' \
               'assets/ui/source/*' \
               'assets/ui/portrait-frame-base.svg' \
               'candlelight.zip' \
               '*.DS_Store'
          unzip -l candlelight.zip | grep -q ' system.json$'
          unzip -l candlelight.zip | grep -q ' assets/ui/portrait-frame.webp$'

      - name: Publish or refresh GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Candlelight ${{ steps.version.outputs.version }}
          body: Automated Foundry VTT system release for Candlelight ${{ steps.version.outputs.version }}.
          make_latest: true
          generate_release_notes: true
          files: |
            candlelight.zip
            system.json
          overwrite_files: true
